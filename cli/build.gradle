plugins { id 'application' }
dependencies { implementation project(':runtime'); runtimeOnly project(':codex-plugin') }
application { mainClass = 'io.localjenkinsfile.cli.Main'; applicationName = 'jenkinsfile-exec' }
distributions {
    main {
        contents {
            from(rootProject.file('LICENSE'))
            from(rootProject.file('README.md'))
            from(rootProject.file('README.ko.md'))
            from(rootProject.file('examples')) {
                into 'examples'
                exclude '**/.local-jenkinsfile/**', 'output/**'
                filesMatching(['Jenkinsfile', 'Executable.Jenkinsfile', 'CodexHello.Jenkinsfile', 'CodexTranslateInput.Jenkinsfile']) {
                    permissions { unix('rwxr-xr-x') }
                }
            }
            from(rootProject.file('docs/plugins.md')) { into 'docs' }
            from(rootProject.file('docs/verification.md')) { into 'docs' }
        }
    }
}
